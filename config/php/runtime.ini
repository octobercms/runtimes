expose_php = Off
memory_limit = 256M

; Production OPcache: compile once per task lifecycle. App images should rebuild
; (new digest) when PHP sources change rather than relying on timestamp checks.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
