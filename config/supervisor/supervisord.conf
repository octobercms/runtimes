[program:php-fpm]
command=php-fpm
environment=HOME="%(ENV_HOME)s",PGSSLCERT="%(ENV_PGSSLCERT)s"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/scheduler.sh
user=www-data
environment=HOME="%(ENV_HOME)s",PGSSLCERT="%(ENV_PGSSLCERT)s",OCTOBER_SCHEDULER_ENABLED="%(ENV_OCTOBER_SCHEDULER_ENABLED)s"
priority=30
autostart=%(ENV_OCTOBER_SCHEDULER_AUTOSTART)s
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
