[program:scheduler]
command=/usr/local/bin/scheduler.sh
user=www-data
environment=HOME="%(ENV_HOME)s",PGSSLCERT="%(ENV_PGSSLCERT)s"
priority=30
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
