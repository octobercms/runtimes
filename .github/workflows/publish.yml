name: Publish

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
  IMAGE_PREFIX: ghcr.io/octobercms

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-base:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4', '8.5']
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags
        id: tags
        run: bash .github/scripts/runtime-tag.sh '${{ matrix.php }}' '${{ matrix.node }}' >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          IMAGE: runtime-base
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          MOVING_TAG: ${{ steps.tags.outputs.MOVING_TAG }}
          PUBLISH_LATEST: ${{ steps.tags.outputs.PUBLISH_LATEST }}
          LEGACY_PHP_TAG: ${{ steps.tags.outputs.LEGACY_PHP_TAG }}
          GIT_REF: ${{ env.GIT_REF }}
        run: bash .github/scripts/prepare-image-tags.sh

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/Dockerfile
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            NODE_VERSION=${{ matrix.node }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish:
    needs: publish-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4', '8.5']
        node: ['24', '26']
        image:
          - name: runtime-dev
            dockerfile: images/dev/Dockerfile

          - name: runtime-prod
            dockerfile: images/prod/Dockerfile

          - name: runtime-worker
            dockerfile: images/worker/Dockerfile

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags
        id: tags
        run: bash .github/scripts/runtime-tag.sh '${{ matrix.php }}' '${{ matrix.node }}' >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          IMAGE: ${{ matrix.image.name }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          MOVING_TAG: ${{ steps.tags.outputs.MOVING_TAG }}
          PUBLISH_LATEST: ${{ steps.tags.outputs.PUBLISH_LATEST }}
          LEGACY_PHP_TAG: ${{ steps.tags.outputs.LEGACY_PHP_TAG }}
          GIT_REF: ${{ env.GIT_REF }}
        run: bash .github/scripts/prepare-image-tags.sh

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}/runtime-base:${{ steps.tags.outputs.MOVING_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
