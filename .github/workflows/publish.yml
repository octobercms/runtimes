name: Publish

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GIT_REF: ${{ github.event.release.tag_name || github.ref_name }}
  IMAGE_PREFIX: ghcr.io/octobercms

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-base:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4', '8.5']
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags
        id: tags
        run: bash .github/scripts/runtime-tag.sh '${{ matrix.php }}' '${{ matrix.node }}' >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          IMAGE: runtime-base
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          MOVING_TAG: ${{ steps.tags.outputs.MOVING_TAG }}
          PUBLISH_LATEST: ${{ steps.tags.outputs.PUBLISH_LATEST }}
          LEGACY_PHP_TAG: ${{ steps.tags.outputs.LEGACY_PHP_TAG }}
          GIT_REF: ${{ env.GIT_REF }}
        run: bash .github/scripts/prepare-image-tags.sh

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/Dockerfile
          push: true
          pull: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            NODE_VERSION=${{ matrix.node }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export base digest
        env:
          IMAGE: runtime-base
          MOVING_TAG: ${{ steps.tags.outputs.MOVING_TAG }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo -n "${DIGEST}" > "${RUNNER_TEMP}/digests/digest"
          {
            echo "### ${IMAGE} (PHP ${{ matrix.php }}, Node ${{ matrix.node }})"
            echo "- Moving: \`${IMAGE_PREFIX}/${IMAGE}:${MOVING_TAG}\`"
            echo "- Digest: \`${IMAGE_PREFIX}/${IMAGE}@${DIGEST}\`"
            echo "- Git SHA: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload base digest
        uses: actions/upload-artifact@v4
        with:
          name: base-digest-${{ matrix.php }}-${{ matrix.node }}
          path: ${{ runner.temp }}/digests/digest
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: publish-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4', '8.5']
        node: ['24', '26']
        image:
          - name: runtime-dev
            dockerfile: images/dev/Dockerfile

          - name: runtime-prod
            dockerfile: images/prod/Dockerfile

          - name: runtime-worker
            dockerfile: images/worker/Dockerfile

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags
        id: tags
        run: bash .github/scripts/runtime-tag.sh '${{ matrix.php }}' '${{ matrix.node }}' >> "$GITHUB_OUTPUT"

      - name: Download base digest
        uses: actions/download-artifact@v4
        with:
          name: base-digest-${{ matrix.php }}-${{ matrix.node }}
          path: ${{ runner.temp }}/digests

      - name: Resolve BASE_IMAGE from digest
        id: base
        run: |
          digest="$(cat "${RUNNER_TEMP}/digests/digest")"
          echo "image=${IMAGE_PREFIX}/runtime-base@${digest}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          IMAGE: ${{ matrix.image.name }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          MOVING_TAG: ${{ steps.tags.outputs.MOVING_TAG }}
          PUBLISH_LATEST: ${{ steps.tags.outputs.PUBLISH_LATEST }}
          LEGACY_PHP_TAG: ${{ steps.tags.outputs.LEGACY_PHP_TAG }}
          GIT_REF: ${{ env.GIT_REF }}
        run: bash .github/scripts/prepare-image-tags.sh

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable references
        env:
          IMAGE: ${{ matrix.image.name }}
          MOVING_TAG: ${{ steps.tags.outputs.MOVING_TAG }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          {
            echo "image=${IMAGE_PREFIX}/${IMAGE}"
            echo "moving_tag=${MOVING_TAG}"
            echo "digest=${DIGEST}"
            echo "git_sha=${GITHUB_SHA}"
            echo "base_image=${{ steps.base.outputs.image }}"
          } > "${RUNNER_TEMP}/digests/refs.txt"
          {
            echo "### ${IMAGE} (PHP ${{ matrix.php }}, Node ${{ matrix.node }})"
            echo "- Moving: \`${IMAGE_PREFIX}/${IMAGE}:${MOVING_TAG}\`"
            echo "- Digest: \`${IMAGE_PREFIX}/${IMAGE}@${DIGEST}\`"
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- Base: \`${{ steps.base.outputs.image }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image refs
        uses: actions/upload-artifact@v4
        with:
          name: refs-${{ matrix.image.name }}-${{ matrix.php }}-${{ matrix.node }}
          path: ${{ runner.temp }}/digests/refs.txt
          if-no-files-found: error
          retention-days: 90
